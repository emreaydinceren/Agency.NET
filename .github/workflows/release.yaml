name: Release (nuget.org)

# Publishes to nuget.org after every successful "CI (GitHub)" run on main — i.e. every sync
# from Gitea that passes CI queues a release. Deliberately separate from ci.yaml: this is the
# only workflow that ever holds a nuget.org-scoped credential, so the credential's blast radius
# is this one gated workflow, not every push/PR build. The `publish` job's `nuget-release`
# environment (required-reviewer protection) is what actually gates publishing — queuing a run
# here is automatic, but nothing reaches nuget.org without a human approving that job.
#
# Versioning is NBGV (Nerdbank.GitVersioning): the version packed is whatever NBGV computes from
# git commit height at the triggering commit, with no separate tag or manual check involved.
#
# Publishing uses NuGet Trusted Publishing (OIDC): the `publish` job exchanges a short-lived
# GitHub OIDC token for a ~1-hour nuget.org API key via `NuGet/login` — no long-lived NuGet
# secret is stored. This requires a one-time, human, external setup that this workflow file
# cannot perform on its own:
#   1. On nuget.org: add a Trusted Publishing policy for repo `emreaydinceren/Agency.NET`,
#      workflow file `release.yaml`, environment `nuget-release`.
#   2. On GitHub: create the `nuget-release` environment and add required-reviewer protection.
#   3. On GitHub: add the `NUGET_USER` secret (your nuget.org username only — not a password
#      or API key).

on:
  workflow_run:
    workflows: ['CI (GitHub)']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-pack:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: dev_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The job runs inside a container on the same Docker network as the `postgres` service, so
      # it's reachable by service name — NOT `localhost`.
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Username=dev_user;Password=dev_password;Database=dev_db

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Pin to the exact commit CI ran against — workflow_run otherwise defaults to the
          # branch tip at trigger time, which can race ahead if another push lands first.
          ref: ${{ github.event.workflow_run.head_sha }}
          # NBGV computes the version from git height since the last version.json bump —
          # a shallow clone can't count that and silently produces a wrong (0.0.x) version.
          fetch-depth: 0

      - name: 📦 Restore dependencies
        working-directory: src
        # src/NuGet.Config also lists baget-local/gitea-local, pointing at a self-hosted feed
        # unreachable from a GitHub-hosted runner. --ignore-failed-sources alone isn't enough:
        # TreatWarningsAsErrors (Directory.Build.props) promotes the resulting NU1801 warning
        # back into a hard error. So GitHub restores from its own nuget.org-only config instead
        # of trying (and failing) to reach the home-lab feeds at all.
        run: dotnet restore --configfile NuGet.GitHub.config

      - name: 🛠️ Build Solution
        working-directory: src
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Run Unit Tests
        working-directory: src
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Functional"

      - name: 🧪 Run Postgres-only Functional Tests
        working-directory: src
        # Category=RequiresLlm tests need the home-lab LM Studio instance, unreachable from a
        # GitHub-hosted runner — everything else in Category=Functional only needs Postgres.
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category=Functional&Category!=Cloud&Category!=RequiresLlm"

      - name: 📦 Pack NuGet packages
        working-directory: src
        run: dotnet pack --configuration Release --no-build --output ./nupkg

      - name: 📤 Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-packages
          path: |
            src/nupkg/*.nupkg
            src/nupkg/*.snupkg
          if-no-files-found: error

      - name: 📋 Generate SBOM
        working-directory: src
        # CycloneDX reads the restore/lock graph directly, aggregating every packable project's
        # direct and transitive NuGet dependencies into one manifest — a machine-readable
        # inventory adopters can run through their own compliance/vulnerability tooling.
        #
        # Unlike the restore step, CycloneDX can't be pointed at NuGet.GitHub.config — it walks
        # the standard NuGet config hierarchy and finds src/NuGet.Config's home-lab feeds,
        # unreachable from a GitHub runner (first hit: v0.1.163, run 31775304718). Overwriting
        # the config is safe here: only the artifact upload follows, nothing after it restores,
        # and `publish` is a separate job on a fresh container that receives artifacts, not this
        # workspace.
        run: |
          cp NuGet.GitHub.config NuGet.Config
          dotnet tool install --global CycloneDX
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet-CycloneDX Agency.slnx -o ./sbom -F Json -fn sbom.json

      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: src/sbom/sbom.json
          if-no-files-found: error

  publish:
    needs: build-test-pack
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    # Requires a `nuget-release` environment configured on GitHub with required-reviewer
    # protection (RT17) — every publish waits on a human approval before this job proceeds.
    environment: nuget-release

    permissions:
      # id-token: write is scoped to only this job for the OIDC nuget.org login; contents: write
      # is scoped here too, for pushing the release tag and creating the GitHub Release below —
      # everywhere else in the workflow keeps the workflow-level `contents: read` default.
      id-token: write
      contents: write

    steps:
      - name: 📥 Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nuget-packages
          path: nupkg

      - name: 🔑 NuGet login (OIDC → temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1 (v1.2.0)
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 🚀 Publish to nuget.org
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: 📥 Checkout (for tagging the released commit)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # NBGV computes the version from git height since the last version.json bump — a
          # shallow clone can't count that and silently produces a wrong (0.0.x) version.
          fetch-depth: 0

      - name: 🔖 Tag the released commit
        # There's no release tag from a trigger anymore (this workflow now runs off CI success,
        # not a `v*` tag push) — create one here, after publish, so a tag/GitHub-Release only ever
        # exists for a commit that was actually pushed to nuget.org. version.json's
        # publicReleaseRefSpec only matches tags, so this build was a `-g<sha>` prerelease; the tag
        # inherits that same prerelease version rather than a clean one.
        id: version
        run: |
          # nbgv shells out to git, which flags this checkout as dubious ownership inside the
          # container (same fix sync-github.yaml already uses for the same reason).
          git config --global --add safe.directory '*'
          dotnet tool install --global nbgv
          export PATH="$HOME/.dotnet/tools:$PATH"
          TAG="v$(nbgv get-version -v NuGetPackageVersion)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 📥 Download SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sbom
          path: sbom

      - name: 📋 Attach SBOM to GitHub Release
        # generate_release_notes uses .github/release.yml's PR-label categorization (RT19) to
        # populate the release body — this step's own job is just giving the SBOM somewhere to
        # live, since nuget.org has no field for an arbitrary extra file.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: sbom/sbom.json
          generate_release_notes: true
